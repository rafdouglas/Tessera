[project]
name = "tessera"
version = "0.5.8"
description = "Tessera — Cartographic ideogram toolkit for QGIS"
requires-python = ">=3.9"
license = "GPL-3.0-only"

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
markers = [
    "gui: marks tests that require full QGIS GUI (may be skipped in CI)",
    "slow: marks tests that take significant time",
    "integration: marks tests using real data files",
]
addopts = "-v --tb=short"

[tool.ruff]
line-length = 120
target-version = "py39"

[tool.ruff.lint]
select = ["E", "F", "W"]
ignore = ["E501", "F401", "F541", "F811"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["F841"]
